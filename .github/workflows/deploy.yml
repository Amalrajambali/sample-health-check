# .github/workflows/deploy.yml
# Deploys to the deploy panel. No secrets: GitHub signs a token that
# proves which repository, branch and workflow the build came from, and
# the panel only accepts this file.
name: Deploy to the panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job prove to the panel which repo and branch it built
    concurrency:
      group: deploy-sample-health-check
      cancel-in-progress: false
    env:
      SERVICE: sample-health-check
      PANEL_URL: https://deploy.pflabs.in
      WORKDIR: .     # the folder with the project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.WORKDIR }}/go.mod
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum
      - name: Test
        working-directory: ${{ env.WORKDIR }}
        run: go test ./...
      - name: Build
        working-directory: ${{ env.WORKDIR }}
        env:
          PACKAGE: .   # what to build, relative to WORKDIR, e.g. ./cmd/server
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/app" "$PACKAGE"
      - name: Deploy
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PANEL_URL" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' --max-time 300 \
            -X POST "$PANEL_URL/api/upload?service=$SERVICE" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/octet-stream" \
            --data-binary @"$RUNNER_TEMP/app")
          if [ "$status" = 200 ]; then
            jq -r .message "$RUNNER_TEMP/answer.json"
          else
            echo "::error::The panel answered $status"
            jq -r '.error // .' "$RUNNER_TEMP/answer.json" 2>/dev/null || cat "$RUNNER_TEMP/answer.json"
            exit 1
          fi